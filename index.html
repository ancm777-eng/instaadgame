<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>요정의 연금술 타이쿤 3D · Fairy Alchemy Tycoon</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- Three.js WebGL 3D Viewport -->
  <div id="webgl-container"></div>

  <!-- 3D -> 2D Projected Floating Combat & Loot Text Layer -->
  <div id="fx-overlay"></div>

  <!-- Over-Head Real-Time 3D-Tracked Character Backpack HUD -->
  <div id="hero-bag-float" class="hero-bag-float" style="display:none" aria-hidden="true">
    <div class="hbf-top">
      <span class="hbf-counts" id="hbf-counts">⛏️ 광석 0</span>
      <span class="hbf-cap num" id="hbf-cap">0 / 25</span>
    </div>
    <div class="hbf-bar-track">
      <div class="hbf-bar-fill" id="hbf-bar-fill"></div>
    </div>
    <div class="hbf-max-badge" id="hbf-max-badge" style="display:none">🎒 가방 가득 참! (MAX)</div>
  </div>

  <!-- Top-Left: Game Title, Wizard Level & Backpack Gauge -->
  <header id="hud-top-left" class="hud-cluster">
    <div class="title-pill">✨ 요정의 연금술 숲 3D</div>

    <div class="glass-card stat-card">
      <div class="stat-row">
        <span class="lv-badge" id="ui-lv">Lv.1</span>
        <span class="hero-role" id="ui-title">견습 꼬마 마법사</span>
      </div>
      <div class="bar-track xp-track">
        <div class="bar-fill xp-fill" id="ui-xp-fill"></div>
      </div>
    </div>

    <div class="glass-card bag-card">
      <div class="stat-row">
        <span class="bag-label">🎒 배낭 적재</span>
        <span class="bag-value num" id="ui-bag">0 / 25</span>
      </div>
      <div class="bar-track bag-track">
        <div class="bar-fill bag-fill" id="ui-bag-fill"></div>
      </div>
    </div>
  </header>

  <!-- Top-Right: Single Green Cash Counter & Compact Controls -->
  <aside id="hud-top-right" class="hud-cluster">
    <div class="currency-row">
      <div class="currency-pill cash-pill" title="보유 캐시">
        <span class="cur-icon">💵</span>
        <span class="cur-name">캐시</span>
        <b class="cur-val num" id="ui-gems">0</b>
      </div>
    </div>

    <div class="control-row">
      <button class="fairy-btn shop-btn" id="btn-open-shop" title="성장 상점 열기">📜 성장 상점</button>
      <button class="fairy-btn icon-btn" id="btn-home" title="중앙 광장으로 귀환">🏡</button>
      <button class="fairy-btn icon-btn" id="btn-mute" title="효과음 켜기/끄기">🔊</button>
      <button class="fairy-btn icon-btn" id="btn-save" title="지금 저장">💾</button>
      <button class="fairy-btn icon-btn danger" id="btn-reset" title="진행 초기화">🗑️</button>
    </div>
  </aside>

  <!-- Giant Playable-Ad Objective Guide Banner -->
  <div id="guide-banner" class="guide-banner">
    <span class="guide-step-badge" id="ui-guide-step">1단계 채집</span>
    <span id="ui-guide-text">👉 오른쪽 동쪽 광산으로 가서 푸른 광석을 캐세요!</span>
    <span class="guide-dist num" id="ui-guide-dist">23m</span>
  </div>

  <!-- Toast Banner -->
  <div id="toast-banner"></div>

  <!-- Full-Screen Touch/Mouse Floating Virtual Joystick Layer -->
  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
    <div id="joystick-hint">화면을 드래그하거나 WASD로 숲을 탐험하세요</div>
  </div>

  <!-- Optional Fairy Alchemy Upgrade & Guide Modal -->
  <div id="shop-modal" class="modal-backdrop">
    <div class="modal-sheet glass-panel">
      <div class="sheet-header">
        <div>
          <h2 id="ui-shop-title">📜 연금술 공방 & 성장 상점</h2>
          <p class="sheet-sub" id="ui-shop-stats">이동 100% · 요정 일꾼 0마리 · 60 FPS</p>
        </div>
        <button class="fairy-btn icon-btn" id="btn-close-shop" title="닫기">✕</button>
      </div>
      <div class="shop-tabs">
        <button class="shop-tab active" data-tab="wizard">🧙 연금술사 강화</button>
        <button class="shop-tab" data-tab="automation">🧚 일꾼 · 트럭 · 설비</button>
        <button class="shop-tab" data-tab="guide">📖 플레이 가이드</button>
      </div>
      <div id="shop-body" class="shop-body"></div>
    </div>
  </div>

  <!-- Save Reset Confirmation Modal -->
  <div id="reset-modal" class="modal-backdrop">
    <div class="modal-confirm glass-panel">
      <h3>🗑️ 모험 기록 초기화</h3>
      <p>현재 모은 💵 캐시, 요정 일꾼, 수확 트럭, 1~3호기 시설 및 강화 레벨이 모두 초기화됩니다. 처음부터 다시 시작할까요?</p>
      <div class="confirm-actions">
        <button class="fairy-btn neutral-btn" id="btn-cancel-reset">취소</button>
        <button class="fairy-btn danger-btn" id="btn-confirm-reset">초기화하기</button>
      </div>
    </div>
  </div>

  <!-- Phase 2 Real CC0 GLB Asset Loader & Chibi 3D Game Modules -->
  <script src="src/vendor/GLTFLoader.js"></script>
  <script src="src/vendor/SkeletonUtils.js"></script>
  <script src="src/vendor/RoomEnvironment.js"></script>
  <script src="src/asset-loader.js"></script>
  <script src="src/chibi-characters.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/gameplay.js"></script>
</body>
</html>
